<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1320px;
    height: 2868px;
    overflow: hidden;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: relative;
    width: 1320px;
    height: 2868px;
    background:
      radial-gradient(1400px 1100px at 50% 62%, rgba(251,113,133,0.38) 0%, rgba(0,0,0,0) 60%),
      linear-gradient(168deg, #4c0519 0%, #881337 55%, #be123c 100%);
    overflow: hidden;
  }
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 80% at 50% 110%, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 55%);
    pointer-events: none;
  }
  .caption {
    position: absolute;
    top: 150px;
    left: 0; right: 0;
    padding: 0 110px;
    text-align: center;
  }
  .caption h1 {
    color: #ffffff;
    font-size: 98px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -2.8px;
  }
  .caption p {
    margin-top: 32px;
    color: rgba(255,255,255,0.78);
    font-size: 40px;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: -0.3px;
  }
  .phone {
    position: absolute;
    top: 580px;
    left: 50%;
    transform: translateX(-50%);
    width: 1060px;
    filter:
      drop-shadow(0 60px 100px rgba(0,0,0,0.55))
      drop-shadow(0 20px 40px rgba(0,0,0,0.35));
  }
  .phone svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="stage">
    <div class="caption">
      <h1>Master every mistake.</h1>
      <p>Spaced repetition until it sticks.</p>
    </div>
    <div class="phone">
      <svg viewBox="0 0 1060 2303" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Titanium frame: soft cool→warm→cool gradient with subtle highlight rim -->
          <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#6e6e76"/>
            <stop offset="18%"  stop-color="#3a3a40"/>
            <stop offset="50%"  stop-color="#1a1a1d"/>
            <stop offset="82%"  stop-color="#3a3a40"/>
            <stop offset="100%" stop-color="#6e6e76"/>
          </linearGradient>
          <linearGradient id="bezel-rim" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.35)"/>
            <stop offset="6%"   stop-color="rgba(255,255,255,0.0)"/>
            <stop offset="94%"  stop-color="rgba(255,255,255,0.0)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0.18)"/>
          </linearGradient>
          <linearGradient id="button" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#2a2a30"/>
            <stop offset="50%"  stop-color="#5a5a60"/>
            <stop offset="100%" stop-color="#2a2a30"/>
          </linearGradient>
          <clipPath id="screen-clip">
            <rect x="20" y="20" width="1020" height="2263" rx="116" ry="116"/>
          </clipPath>
        </defs>

        <!-- Side buttons (sit behind the frame, sticking out the edges) -->
        <!-- Left: action button (small) -->
        <rect x="-4" y="288" width="10" height="56" rx="3" fill="url(#button)"/>
        <!-- Left: volume up -->
        <rect x="-4" y="382" width="10" height="108" rx="3" fill="url(#button)"/>
        <!-- Left: volume down -->
        <rect x="-4" y="514" width="10" height="108" rx="3" fill="url(#button)"/>
        <!-- Right: power button -->
        <rect x="1054" y="432" width="10" height="188" rx="3" fill="url(#button)"/>

        <!-- Titanium outer frame -->
        <rect x="0" y="0" width="1060" height="2303" rx="132" ry="132" fill="url(#titanium)"/>

        <!-- Inner screen black bed (visible as thin ring) -->
        <rect x="14" y="14" width="1032" height="2275" rx="122" ry="122" fill="#000000"/>

        <!-- Subtle rim highlight on the bezel -->
        <rect x="0" y="0" width="1060" height="2303" rx="132" ry="132"
              fill="none" stroke="url(#bezel-rim)" stroke-width="2"/>

        <!-- The actual screenshot, clipped to the inner screen rounded rect -->
        <image href="file:///Users/mk/Documents/smartie/driver/docs/appstore/raw/en/mistakes.png" x="20" y="20" width="1020" height="2263"
               preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-clip)"/>

        <!-- Dynamic Island -->
        <rect x="385" y="40" width="290" height="92" rx="46" fill="#040405"/>
        <!-- Camera dot inside the DI for realism -->
        <circle cx="620" cy="86" r="11" fill="#0d0d10"/>
        <circle cx="620" cy="86" r="5" fill="#1c1c20"/>

        <!-- Home indicator -->
        <rect x="370" y="2244" width="320" height="9" rx="5" fill="#ffffff" opacity="0.55"/>
      </svg>
    </div>
  </div>
</body>
</html>
