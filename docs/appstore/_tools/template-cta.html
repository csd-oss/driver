<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1320px;
    height: 2868px;
    overflow: hidden;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: relative;
    width: 1320px;
    height: 2868px;
    background:
      radial-gradient(1500px 1200px at 50% 50%, {{GLOW}} 0%, rgba(0,0,0,0) 62%),
      linear-gradient(168deg, {{BG_A}} 0%, {{BG_B}} 55%, {{BG_C}} 100%);
    overflow: hidden;
  }
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 80% at 50% 110%, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 55%);
    pointer-events: none;
  }
  .gift {
    position: absolute;
    top: 480px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 320px;
    line-height: 1;
    filter: drop-shadow(0 50px 80px rgba(0,0,0,0.55));
  }
  .headline {
    position: absolute;
    top: 980px;
    left: 0; right: 0;
    text-align: center;
    padding: 0 80px;
  }
  .headline h1 {
    color: #ffffff;
    font-size: 188px;
    font-weight: 800;
    line-height: 0.96;
    letter-spacing: -6px;
    margin-bottom: 48px;
  }
  .headline p {
    color: rgba(255,255,255,0.82);
    font-size: 56px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.6px;
  }
  .ribbon {
    position: absolute;
    top: 1620px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 24px;
    padding: 36px 72px;
    border-radius: 999px;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.26);
    backdrop-filter: blur(24px);
    color: #ffffff;
    font-size: 48px;
    font-weight: 600;
    letter-spacing: -0.3px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.3);
  }
  .ribbon::before {
    content: "";
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 32px rgba(52,211,153,0.95);
  }
  .footer {
    position: absolute;
    bottom: 200px;
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.55);
    font-size: 32px;
    font-weight: 500;
    letter-spacing: 6px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="gift">🎁</div>
    <div class="headline">
      <h1>{{CAPTION}}</h1>
      <p>{{SUB}}</p>
    </div>
    <div class="ribbon">{{TRIAL_PILL}}</div>
    <div class="footer">Driver SK</div>
  </div>
</body>
</html>
