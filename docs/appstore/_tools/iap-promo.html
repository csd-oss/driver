<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1024px; height: 1024px; overflow: hidden;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: relative; width: 1024px; height: 1024px; overflow: hidden;
    background:
      radial-gradient(900px 760px at 50% 38%, rgba(99,102,241,0.45) 0%, rgba(0,0,0,0) 60%),
      linear-gradient(165deg, #1e1b4b 0%, #312e81 52%, #4338ca 100%);
  }
  .stage::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 80% at 50% 112%, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0) 55%);
  }
  .wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0;
  }
  .badge {
    width: 220px; height: 220px; border-radius: 56px;
    display: flex; align-items: center; justify-content: center;
    font-size: 132px; line-height: 1;
    background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
    border: 2px solid rgba(255,255,255,0.22);
    box-shadow: 0 40px 80px rgba(0,0,0,0.45), inset 0 2px 8px rgba(255,255,255,0.18);
    margin-bottom: 64px;
  }
  .wordmark {
    color: #F8FAFC; font-size: 132px; font-weight: 800;
    letter-spacing: -4px; line-height: 1;
  }
  .pro {
    margin-top: 40px;
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    color: #1e1b4b; font-size: 56px; font-weight: 800;
    letter-spacing: 10px; padding: 18px 52px 18px 62px; border-radius: 999px;
    box-shadow: 0 20px 44px rgba(245,158,11,0.45);
  }
  .tag {
    margin-top: 64px;
    color: rgba(255,255,255,0.82); font-size: 42px; font-weight: 500;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="wrap">
      <div class="badge">🪪</div>
      <div class="wordmark">Driver SK</div>
      <div class="pro">PRO</div>
      <div class="tag">Smart practice. Real results.</div>
    </div>
  </div>
</body>
</html>
