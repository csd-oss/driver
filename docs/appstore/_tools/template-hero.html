<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1320px;
    height: 2868px;
    overflow: hidden;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: relative;
    width: 1320px;
    height: 2868px;
    background:
      radial-gradient(1500px 1200px at 50% 58%, {{GLOW}} 0%, rgba(0,0,0,0) 62%),
      linear-gradient(168deg, {{BG_A}} 0%, {{BG_B}} 55%, {{BG_C}} 100%);
    overflow: hidden;
  }
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 80% at 50% 110%, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 55%);
    pointer-events: none;
  }
  .caption {
    position: absolute;
    top: 160px;
    left: 0; right: 0;
    padding: 0 90px;
    text-align: center;
  }
  .caption h1 {
    color: #ffffff;
    font-size: 122px;
    font-weight: 800;
    line-height: 0.98;
    letter-spacing: -3.8px;
  }
  .caption p {
    margin-top: 40px;
    color: rgba(255,255,255,0.8);
    font-size: 46px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.4px;
  }
  .phone {
    position: absolute;
    top: 720px;
    left: 50%;
    transform: translateX(-50%);
    width: 1120px;
    filter:
      drop-shadow(0 70px 120px rgba(0,0,0,0.65))
      drop-shadow(0 25px 50px rgba(0,0,0,0.4));
  }
  /* Capture is pre-composited into the real Apple frame by compose.py. */
  .phone .device { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="stage">
    <div class="caption">
      <h1>{{CAPTION}}</h1>
      <p>{{SUB}}</p>
    </div>
    <div class="phone">
      <img class="device" src="{{DEVICE}}" />
    </div>
  </div>
</body>
</html>
