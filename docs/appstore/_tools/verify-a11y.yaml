# Verification flow for accessibility fixes (not a marketing capture).
# OUTDIR is set per run so the same flow can capture at different text sizes.
#   maestro --device $SIM test -e OUTDIR=/tmp/a11y/normal docs/appstore/_tools/verify-a11y.yaml
appId: com.smartie.driver
---
- launchApp
- tapOn: { text: "Cancel", optional: true }
- extendedWaitUntil: { visible: { id: "screen.home" }, timeout: 20000 }
- takeScreenshot: "${OUTDIR}/home"

# Settings: switch sliver fix + larger-text layout
- openLink: "driver://settings"
- tapOn: { text: "Open", optional: true }
- extendedWaitUntil: { visible: { id: "screen.settings" }, timeout: 12000 }
- takeScreenshot: "${OUTDIR}/settings"

# Stats: two-column rows reflow at larger text
- openLink: "driver://stats"
- tapOn: { text: "Open", optional: true }
- extendedWaitUntil: { visible: { id: "screen.stats" }, timeout: 12000 }
- takeScreenshot: "${OUTDIR}/stats"

# Study answered: green correct + ✓/✗ (Differentiate Without Color)
- openLink: "driver://study"
- tapOn: { text: "Open", optional: true }
- extendedWaitUntil: { visible: { id: "screen.study" }, timeout: 12000 }
- tapOn: { id: "study.answer.1" }
- takeScreenshot: "${OUTDIR}/study-answered"

# Mock nav badges: ✓ on answered dots
- openLink: "driver://mock?t=62"
- tapOn: { text: "Open", optional: true }
- extendedWaitUntil: { visible: { id: "screen.mock" }, timeout: 12000 }
- tapOn: { id: "mock.answer.1" }
- tapOn: { text: "Next" }
- tapOn: { id: "mock.answer.2" }
- takeScreenshot: "${OUTDIR}/mock-nav"
