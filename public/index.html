<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets safe-area insets reach the app in standalone mode (notch / home bar) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>%WEB_TITLE%</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Driver SK" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView>.
         Fixed + inset keeps the page glued to the visual viewport on iOS
         Safari, whose 100% height ignores the collapsing toolbar. */
      body {
        overflow: hidden;
        position: fixed;
        inset: 0;
        width: 100%;
        overscroll-behavior: none;
        /* Match the app background so there is no white flash before React mounts */
        background: #f8fafc;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>

    <script>
      // expo-sqlite on web keeps the database open through OPFS sync access
      // handles, which only one page per origin can hold. Holding a Web Lock
      // for the page's lifetime (a) keeps Chrome from parking this page in the
      // back/forward cache with the handles still open, and (b) lets a second
      // tab detect the first one instead of failing with a cryptic error.
      if (navigator.locks) {
        navigator.locks.request('driver-sk-db', { ifAvailable: true }, function (lock) {
          if (lock) {
            return new Promise(function () {}); // held until the page is destroyed
          }
          var notice = document.createElement('div');
          notice.id = 'driver-other-tab';
          notice.setAttribute('role', 'alert');
          notice.style.cssText =
            'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;' +
            'padding:24px;text-align:center;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;' +
            'background:#0f172a;color:#f8fafc;';
          notice.innerHTML =
            '<div><div style="font-size:20px;font-weight:600;margin-bottom:8px">Driver SK is already open in another tab</div>' +
            '<div style="color:#cbd5e1">Close the other tab and this one will continue automatically.<br>' +
            'Zatvor druhú kartu a táto bude pokračovať automaticky.</div></div>';
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function () {
              document.body.appendChild(notice);
            });
          } else {
            document.body.appendChild(notice);
          }
          // Wait for the other page to go away, then start fresh here.
          return navigator.locks.request('driver-sk-db', function () {
            location.reload();
          });
        });
      }

      // Capture the install prompt before React mounts. src/lib/platform.ts reads it.
      window.__driverInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__driverInstallPrompt = event;
      });

      // Register the service worker generated by scripts/build-web.mjs.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (error) {
            console.warn('[pwa] service worker registration failed', error);
          });
        });
      }
    </script>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. The wordmark inside is a static
         placeholder shown while the database worker starts; React replaces it. -->
    <div id="root">
      <div style="flex:1;display:flex;align-items:center;justify-content:center;font:700 34px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f8fafc;letter-spacing:-0.02em;">Driver SK</div>
    </div>
  </body>
</html>
