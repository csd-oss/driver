<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets safe-area insets reach the app in standalone mode (notch / home bar) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>%WEB_TITLE%</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Driver SK" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView>.
         Fixed + inset keeps the page glued to the visual viewport on iOS
         Safari, whose 100% height ignores the collapsing toolbar. */
      body {
        overflow: hidden;
        position: fixed;
        inset: 0;
        width: 100%;
        overscroll-behavior: none;
        /* Match the app background so there is no white flash before React mounts */
        background: #f8fafc;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
        }
        #driver-splash {
          color: #f8fafc;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
      /* Home-screen app with a translucent status bar: WebKit sizes the
         window to screen minus the status bar (812 of 874 pt on a Dynamic
         Island phone) but paints from the top edge, leaving a dead strip at
         the bottom. 100vh is the full screen height in that mode, measured
         with an on-page ruler in the simulator. */
      @media (display-mode: standalone) {
        html, body { height: 100vh; }
        body { bottom: auto; }
        #root { height: 100vh; }
      }
    </style>

    <script>
      // expo-sqlite on web keeps the database open through OPFS sync access
      // handles, which only one page per origin can hold. Holding a Web Lock
      // for the page's lifetime (a) keeps Chrome from parking this page in the
      // back/forward cache with the handles still open, and (b) lets a second
      // tab detect the first one instead of failing with a cryptic error.
      if (navigator.locks) {
        navigator.locks.request('driver-sk-db', { ifAvailable: true }, function (lock) {
          if (lock) {
            return new Promise(function () {}); // held until the page is destroyed
          }
          var notice = document.createElement('div');
          notice.id = 'driver-other-tab';
          notice.setAttribute('role', 'alert');
          notice.style.cssText =
            'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;' +
            'padding:24px;text-align:center;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;' +
            'background:#0f172a;color:#f8fafc;';
          notice.innerHTML =
            '<div><div style="font-size:20px;font-weight:600;margin-bottom:8px">Driver SK is already open in another tab</div>' +
            '<div style="color:#cbd5e1">Close the other tab and this one will continue automatically.<br>' +
            'Zatvor druhú kartu a táto bude pokračovať automaticky.</div></div>';
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function () {
              document.body.appendChild(notice);
            });
          } else {
            document.body.appendChild(notice);
          }
          // Wait for the other page to go away, then start fresh here.
          return navigator.locks.request('driver-sk-db', function () {
            location.reload();
          });
        });
      }

      // Storage failure message. Shown when the SQLite worker cannot open its
      // database (private browsing, blocked site data, no OPFS support), or
      // when nothing has mounted after 45 s for any other reason. Without
      // this the page would sit on the wordmark forever.
      (function () {
        var shown = false;
        function showUnavailable() {
          if (shown) return;
          shown = true;
          var lang = (navigator.language || '').toLowerCase();
          var sk = lang.indexOf('sk') === 0 || lang.indexOf('cs') === 0;
          var hu = lang.indexOf('hu') === 0;
          var title = sk ? 'Driver SK sa tu nedá spustiť'
            : hu ? 'A Driver SK itt nem indítható'
            : 'Driver SK cannot start here';
          var body = sk
            ? 'Prehliadač nedovolí aplikácii ukladať dáta. Stáva sa to v súkromnom (anonymnom) okne alebo pri zablokovaných údajoch stránok. Otvor driver.smartie.team v bežnej karte Safari alebo Chrome, alebo si aplikáciu pridaj na plochu.'
            : hu
              ? 'A böngésző nem engedi az alkalmazásnak az adatok mentését. Ez privát ablakban vagy letiltott webhelyadatok esetén fordul elő. Nyisd meg a driver.smartie.team címet egy normál Safari vagy Chrome lapon, vagy add hozzá a kezdőképernyőhöz.'
              : 'The browser will not let the app store data. This happens in a private (incognito) window or when site data is blocked. Open driver.smartie.team in a normal Safari or Chrome tab, or add it to your home screen.';
          var retry = sk ? 'Skúsiť znova' : hu ? 'Újra' : 'Try again';
          var root = document.getElementById('root');
          root.innerHTML =
            '<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:16px/1.5 -apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;color:#f8fafc;background:#0f172a">' +
            '<div style="max-width:420px"><div style="font-size:22px;font-weight:700;margin-bottom:12px">' + title + '</div>' +
            '<div style="color:#cbd5e1;margin-bottom:20px">' + body + '</div>' +
            '<button onclick="location.reload()" style="font:600 16px inherit;color:#fff;background:#4f46e5;border:0;border-radius:12px;padding:12px 20px;cursor:pointer">' + retry + '</button></div></div>';
        }
        var ready = false;
        window.addEventListener('driver:db-ready', function () { ready = true; });
        window.addEventListener('driver:db-unavailable', showUnavailable);
        setTimeout(function () {
          if (ready) return;
          var root = document.getElementById('root');
          // Still only the static wordmark: nothing mounted.
          if (root && root.children.length <= 1 && !root.querySelector('[data-testid]')) showUnavailable();
        }, 45000);
      })();

      // Capture the install prompt before React mounts. src/lib/platform.ts reads it.
      window.__driverInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__driverInstallPrompt = event;
      });

      // Register the service worker generated by scripts/build-web.mjs.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (error) {
            console.warn('[pwa] service worker registration failed', error);
          });
        });
      }
    </script>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. The wordmark inside is a static
         placeholder shown while the database worker starts; React replaces it. -->
    <div id="root">
      <div id="driver-splash" style="flex:1;display:flex;align-items:center;justify-content:center;font:700 34px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a;letter-spacing:-0.02em;">Driver SK</div>
    </div>
  </body>
</html>
