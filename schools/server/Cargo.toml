[package]
name = "schools"
description = "Driver for driving schools: accounts, the school CRM API, app progress sync and PDF documents. One binary."
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
genpdf = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "derive", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-well-known", "serde-human-readable", "macros", "formatting", "parsing", "local-offset"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "v4", "serde"] }
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"
