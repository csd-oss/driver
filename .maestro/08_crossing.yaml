# Crossings minigame: open it from the game hub, start a run, press GO, see feedback.
appId: com.smartie.driver
---
- launchApp:
    clearState: true
- runFlow: subflows/complete_onboarding.yaml
- tapOn:
    id: "home.game"
- extendedWaitUntil:
    visible:
      id: "screen.game"
    timeout: 10000
- tapOn:
    id: "game.playCrossing"
- extendedWaitUntil:
    visible:
      id: "screen.crossing"
    timeout: 10000
- tapOn:
    id: "crossing.start"
- extendedWaitUntil:
    visible:
      id: "crossing.scene"
    timeout: 10000
# Swipe down on the road to stop, then up to move off; the run continues either way.
- swipe:
    start: "50%,45%"
    end: "50%,65%"
    duration: 200
- swipe:
    start: "50%,65%"
    end: "50%,45%"
    duration: 200
- assertVisible:
    id: "crossing.scene"
