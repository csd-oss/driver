# Play opens the road directly; the guide remains an optional hub action.
appId: com.smartie.driver
---
- launchApp:
    clearState: true
- runFlow: subflows/complete_onboarding.yaml
- tapOn:
    id: home.game
- extendedWaitUntil:
    visible:
      id: screen.game
    timeout: 15000
- tapOn:
    id: game.playCrossing
- extendedWaitUntil:
    visible:
      id: crossing.scene
    timeout: 15000
- tapOn:
    id: crossing.control.brake
- assertNotVisible:
    id: guide.start
- assertNotVisible:
    id: crossing.intro
- tapOn:
    id: crossing.pause
- assertVisible: Drive paused
- assertVisible:
    id: crossing.control.left
- assertVisible:
    id: crossing.control.right
- tapOn:
    id: crossing.pause
- assertVisible:
    id: crossing.scene
- tapOn:
    id: crossing.control.go
