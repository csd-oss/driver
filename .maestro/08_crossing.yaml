# The first drive starts with the guide, using the same controls as practice.
appId: com.smartie.driver
---
- launchApp:
    clearState: true
- runFlow: subflows/complete_onboarding.yaml
- tapOn:
    id: home.game
- tapOn:
    id: game.playCrossing
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: guide.scene
    timeout: 15000
- tapOn:
    id: crossing.control.brake
    waitToSettleTimeoutMs: 0
- assertNotVisible:
    id: guide.start
- assertNotVisible:
    id: crossing.intro
- tapOn:
    id: crossing.pause
    waitToSettleTimeoutMs: 0
- assertVisible: Drive paused
- assertVisible:
    id: crossing.control.left
- assertVisible:
    id: crossing.control.right
- tapOn:
    id: crossing.pause
    waitToSettleTimeoutMs: 0
- tapOn:
    id: crossing.control.go
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: guide.scene
