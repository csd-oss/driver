# Crossings minigame: open it from the game hub, start a run, press GO, see feedback.
appId: com.smartie.driver
---
- launchApp:
    clearState: true
- runFlow: subflows/complete_onboarding.yaml
- tapOn:
    id: "home.game"
- extendedWaitUntil:
    visible:
      id: "screen.game"
    timeout: 10000
# Crossings is locked until the guide is finished, so take the guide's
# first lesson and let the screen send us on to the runner afterwards.
- tapOn:
    id: "game.startGuide"
    optional: true
- tapOn:
    id: "game.playCrossing"
    optional: true
- extendedWaitUntil:
    visible:
      id: "screen.crossingGuide"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: "screen.crossingGuide"
    commands:
      - back
      - extendedWaitUntil:
          visible:
            id: "screen.game"
          timeout: 10000
      - tapOn:
          id: "game.startGuide"
      - extendedWaitUntil:
          visible:
            id: "guide.brief"
          timeout: 10000
- extendedWaitUntil:
    visible:
      id: "screen.crossing"
    timeout: 10000
    optional: true
- tapOn:
    id: "crossing.start"
- extendedWaitUntil:
    visible:
      id: "crossing.scene"
    timeout: 10000
# Swipe down on the road to stop, then up to move off; the run continues either way.
- swipe:
    start: "50%,45%"
    end: "50%,65%"
    duration: 200
- swipe:
    start: "50%,65%"
    end: "50%,45%"
    duration: 200
- assertVisible:
    id: "crossing.scene"
