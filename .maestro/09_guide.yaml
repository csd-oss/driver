# Continuous guide: native bottom controls and pause, without lesson cards.
appId: com.smartie.driver
---
- launchApp:
    clearState: true
- runFlow: subflows/complete_onboarding.yaml
- tapOn:
    id: home.game
- extendedWaitUntil:
    visible:
      id: screen.game
    timeout: 15000
- tapOn:
    id: game.replayGuide
- extendedWaitUntil:
    visible:
      id: guide.start
    timeout: 15000
- tapOn:
    id: guide.start
- extendedWaitUntil:
    visible:
      id: guide.scene
    timeout: 15000
- assertVisible:
    id: crossing.control.left
- assertVisible:
    id: crossing.control.right
- assertVisible:
    id: crossing.control.brake
- assertVisible:
    id: crossing.control.go
- tapOn:
    id: crossing.pause
- assertVisible: Drive paused
- tapOn:
    id: crossing.pause
- assertVisible:
    id: crossing.instruction
- tapOn:
    id: crossing.control.brake
- tapOn:
    id: crossing.control.go
- assertNotVisible:
    id: guide.next
- assertVisible:
    id: guide.scene
