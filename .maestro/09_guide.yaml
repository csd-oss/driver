# Alex teaches controls in one continuous drive, with no lesson cards.
appId: com.smartie.driver
---
- launchApp:
    clearState: true
- runFlow: subflows/complete_onboarding.yaml
- tapOn:
    id: home.game
- tapOn:
    id: game.playCrossing
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: guide.scene
    timeout: 15000
- assertVisible: '.*Alex.*'
- assertVisible:
    id: crossing.control.left
- assertVisible:
    id: crossing.control.right
- assertVisible:
    id: crossing.control.brake
- assertVisible:
    id: crossing.control.go
- swipe:
    start: 50%, 38%
    end: 50%, 60%
    duration: 500
- extendedWaitUntil:
    visible: 'The way is clear. Tap Go to move off.'
    timeout: 10000
- swipe:
    start: 50%, 60%
    end: 50%, 38%
    duration: 500
- assertNotVisible:
    id: guide.next
- assertVisible:
    id: guide.scene
