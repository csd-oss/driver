# First drive hub: Alex introduces practice; the intersection quiz is gone.
appId: com.smartie.driver
---
- launchApp:
    clearState: true
- runFlow: subflows/complete_onboarding.yaml
- tapOn:
    id: home.game
- assertVisible: Alex
- assertVisible:
    id: game.playCrossing
- assertNotVisible:
    id: game.playQuiz
- assertNotVisible:
    id: game.replayGuide
- tapOn:
    id: game.crossingLog
- assertVisible:
    id: crossing.log.emptyState
