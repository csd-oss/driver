# Game: start a round of "Who goes first?", answer one situation, see the feedback.
appId: com.smartie.driver
---
- launchApp:
    clearState: true
- runFlow: subflows/complete_onboarding.yaml
- tapOn:
    id: "home.game"
- extendedWaitUntil:
    visible:
      id: "screen.game"
    timeout: 10000
- tapOn:
    id: "game.start"
- extendedWaitUntil:
    visible:
      id: "game.score"
    timeout: 10000
# Answer with whatever the first situation offers: a chip or a plain answer.
- runFlow:
    when:
      visible:
        id: "game.chip.you"
    commands:
      - tapOn:
          id: "game.chip.you"
- runFlow:
    when:
      visible:
        id: "game.answer.1"
    commands:
      - tapOn:
          id: "game.answer.1"
- extendedWaitUntil:
    visible:
      id: "game.next"
    timeout: 25000
- tapOn:
    id: "game.next"
- assertVisible:
    id: "screen.game"
